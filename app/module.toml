version = 2

[module]
type = "android-app"
name = "app"
languageLevel = "JAVA_21"
output = "build/classes"

[sourceSets.debug]
scope = "IMPLEMENTATION"
aidl = ["src/debug/aidl"]
assets = ["src/debug/assets"]
java = ["src/debug/java", "src/debug/kotlin"]
jniLibs = ["src/debug/jniLibs"]
res = ["src/debug/res"]
resources = ["src/debug/resources"]

[sourceSets.main]
scope = "IMPLEMENTATION"
aidl = ["src/main/aidl"]
assets = ["src/main/assets"]
java = ["src/main/java", "src/main/kotlin"]
jniLibs = ["src/main/jniLibs"]
res = ["src/main/res"]
resources = ["src/main/resources"]

[sourceSets.release]
scope = "IMPLEMENTATION"
aidl = ["src/release/aidl"]
assets = ["src/release/assets"]
java = ["src/release/java", "src/release/kotlin"]
jniLibs = ["src/release/jniLibs"]
res = ["src/release/res"]
resources = ["src/release/resources"]

[dependencies]
implementation = ["Dhizuku-API-2.6.0.aar", "androidx.core:core:1.16.0", "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"]

[android]
namespace = "com.nsyhykui.dhizuku.cli"
compileSdk = 37
minSdk = 26
targetSdk = 30
manifest = "src/main/AndroidManifest.xml"
versionCode = 2
versionName = "2.0.0"
isApplication = true
manifestPlaceholders = []
buildTypes = [{ name = "debug", debuggable = true, minifyEnabled = false, shrinkResources = false }, { name = "dhizuku-cli-release", debuggable = false, minifyEnabled = false, shrinkResources = false, proguardFiles = ["proguard-android-optimize.txt", "proguard-rules.pro"], signingConfig = "release" }]
